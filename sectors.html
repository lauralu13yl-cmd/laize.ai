<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sectors — laize.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f0d0a;--ink2:#1a1714;--ink3:#2e2a26;
  --sand:#f5f0e8;--sand2:#ede6d8;--sand3:#e2d8c8;--sand4:#c8bca8;
  --warm:#c8a882;--warm2:#a8845a;
  --sage2:#5a7d6a;--sage3:#d8e8dc;
  --rust:#c85a38;--rust2:#e87850;--rust3:#f5e0d8;
  --clay2:#e8c89a;--cream:#faf8f4;--r:0px;
}
html{scroll-behavior:smooth}
body{
  background:var(--cream);
  font-family:'Space Grotesk',system-ui,sans-serif;
  color:var(--ink);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
}

/* ── NAV ── */
.nav{
  background:var(--ink);height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;position:sticky;top:0;z-index:200;
  border-bottom:1px solid rgba(245,240,232,.06);
}
.logo{
  font-family:'Space Mono',monospace;font-size:16px;font-weight:700;
  color:var(--sand);letter-spacing:-.5px;text-decoration:none;
  display:flex;align-items:center;gap:7px;
}
.logo-dot{
  width:7px;height:7px;border-radius:50%;background:var(--rust);flex-shrink:0;
  animation:blink 3s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.nav-links{display:flex;gap:0;list-style:none}
.nav-links a{
  font-family:'Space Mono',monospace;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(245,240,232,.35);padding:0 1.1rem;height:52px;
  display:flex;align-items:center;cursor:pointer;
  border-bottom:2px solid transparent;transition:all .25s;text-decoration:none;
}
.nav-links a:hover{color:var(--sand)}
.nav-links a.on{color:var(--sand);border-bottom-color:var(--rust)}
.nav-r{display:flex;gap:8px;align-items:center}
.nav-user{font-family:'Space Mono',monospace;font-size:10px;color:rgba(245,240,232,.3);letter-spacing:.08em}
.pill{
  font-family:'Space Mono',monospace;background:var(--rust);color:#fff;border:none;
  padding:7px 16px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
}
.pill:hover{background:var(--rust2);transform:translateY(-1px)}
.pill.ghost{background:transparent;border:1px solid rgba(245,240,232,.2);color:rgba(245,240,232,.55)}
.pill.ghost:hover{border-color:rgba(245,240,232,.5);color:var(--sand)}
.pill.sm{padding:6px 13px;font-size:10px}

/* ── SHELL ── */
.shell{
  display:grid;grid-template-columns:200px 1fr;
  min-height:calc(100vh - 52px);background:var(--cream);
}

/* ── SIDEBAR ── */
.sb{
  background:var(--ink);padding:1.5rem 1.1rem;
  display:flex;flex-direction:column;gap:2px;
  position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;
}
.sb-logo{
  font-family:'Space Mono',monospace;font-size:15px;font-weight:700;
  color:var(--sand);letter-spacing:-.5px;padding-bottom:1.1rem;
  border-bottom:1px solid rgba(245,240,232,.08);margin-bottom:.75rem;
  display:flex;align-items:center;gap:7px;
}
.sb-logo-dot{width:6px;height:6px;border-radius:50%;background:var(--rust);flex-shrink:0}
.snav{
  display:flex;align-items:center;gap:9px;padding:9px 10px;
  font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;
  color:rgba(245,240,232,.38);cursor:pointer;transition:all .2s;text-decoration:none;
}
.snav:hover,.snav.on{background:rgba(245,240,232,.07);color:var(--sand)}
.snavdot{width:4px;height:4px;background:var(--rust);flex-shrink:0;opacity:0;transition:opacity .2s}
.snav.on .snavdot{opacity:1}
.sb-back{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(245,240,232,.3);
  cursor:pointer;transition:all .2s;margin-bottom:4px;border:none;background:none;
}
.sb-back:hover{background:rgba(245,240,232,.06);color:rgba(245,240,232,.6)}
.sb-sector-title{
  padding:6px 10px;font-family:'Space Grotesk',sans-serif;
  font-size:14px;font-weight:700;color:var(--sand);
  letter-spacing:-.3px;margin-bottom:4px;
}
.sb-divider{height:1px;background:rgba(245,240,232,.07);margin:.65rem 0}
.slbl{
  font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(245,240,232,.18);margin:.75rem 0 .25rem 10px;
}
.sitm{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 10px;font-family:'Space Mono',monospace;font-size:11px;
  color:rgba(245,240,232,.38);cursor:pointer;transition:all .2s;
}
.sitm:hover,.sitm.on{background:rgba(245,240,232,.07);color:var(--sand)}
.sitm-c{font-size:9px;color:rgba(245,240,232,.18)}
.sitm.on .sitm-c{color:rgba(245,240,232,.35)}
.sb-foot{margin-top:auto;padding-top:.85rem;border-top:1px solid rgba(245,240,232,.07)}
.suser{display:flex;align-items:center;gap:9px}
.sav{
  width:28px;height:28px;background:var(--rust3);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:var(--rust);flex-shrink:0;
}
.sun{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:rgba(245,240,232,.5)}
.sur{font-family:'Space Mono',monospace;font-size:9px;color:rgba(245,240,232,.2);letter-spacing:.06em}

/* ── MAIN ── */
.main{padding:2rem;overflow:hidden}
.sec-lbl{
  font-family:'Space Mono',monospace;font-size:9px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--warm2);font-weight:700;
}

/* ── BADGES ── */
.bdg{padding:3px 9px;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.06em}
.bdg-free{background:var(--sage3);color:var(--sage2)}
.bdg-paid{background:var(--rust3);color:var(--rust)}
.bdg-new{background:var(--ink);color:var(--sand)}
.bdg-hot{background:var(--rust3);color:var(--rust)}

/* ── SECTOR PICKER ── */
.picker-header{margin-bottom:2rem}
.picker-eyebrow{
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--warm2);margin-bottom:.75rem;
  display:flex;align-items:center;gap:12px;
}
.picker-eyebrow::before{content:'';width:24px;height:1px;background:var(--warm2)}
.picker-h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(28px,4vw,44px);font-weight:700;
  letter-spacing:-2px;line-height:.95;color:var(--ink);margin-bottom:.5rem;
}
.picker-h1 em{font-style:normal;color:var(--rust)}
.picker-sub{font-family:'Space Mono',monospace;font-size:11px;color:var(--warm2);letter-spacing:.04em;margin-bottom:1.5rem}
.picker-search{
  display:flex;align-items:center;gap:8px;background:var(--sand);
  border:1px solid var(--sand3);padding:9px 16px;
  max-width:340px;transition:border-color .2s;
}
.picker-search:focus-within{border-color:var(--ink)}
.picker-search input{
  background:none;border:none;outline:none;
  font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--ink);flex:1;
}
.picker-search input::placeholder{color:var(--warm)}
.picker-search-icon{font-family:'Space Mono',monospace;font-size:14px;color:var(--warm)}

/* SECTOR GRID */
.sector-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--sand3)}
.sector-card{
  padding:1.5rem 1.25rem;border-right:1px solid var(--sand3);border-bottom:1px solid var(--sand3);
  cursor:pointer;transition:all .25s;position:relative;overflow:hidden;background:var(--cream);
}
.sector-card:nth-child(4n){border-right:none}
.sector-card:nth-last-child(-n+4){border-bottom:none}
.sector-card:hover{background:var(--sand)}
.sector-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--rust);transform:scaleX(0);transform-origin:left;transition:transform .3s;
}
.sector-card:hover::after{transform:scaleX(1)}
.sc-num{
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;
  color:rgba(15,13,10,.15);margin-bottom:.75rem;
}

.sector-card:hover 
.sc-name{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px;letter-spacing:-.3px}
.sc-sub{font-family:'Space Mono',monospace;font-size:9px;color:var(--warm2);letter-spacing:.04em;margin-bottom:8px}
.sc-count{font-family:'Space Mono',monospace;font-size:11px;color:var(--rust);letter-spacing:.06em}

/* ── SECTOR HEADER ── */
.sector-header{
  background:var(--ink);padding:1.75rem 2rem;margin-bottom:1.5rem;
  display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
  position:relative;overflow:hidden;
}
.sector-header::before{
  content:attr(data-sector);
  position:absolute;right:-10px;bottom:-20px;
  font-family:'Space Grotesk',sans-serif;font-size:100px;font-weight:700;
  letter-spacing:-6px;color:rgba(245,240,232,.04);line-height:1;pointer-events:none;
  text-transform:uppercase;
}
.sh-left{}
.sh-eyebrow{
  font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(245,240,232,.3);margin-bottom:6px;
}
.sh-title{
  font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;
  color:var(--sand);letter-spacing:-1px;
}
.sh-sub{font-family:'Space Mono',monospace;font-size:10px;color:rgba(245,240,232,.35);margin-top:4px;letter-spacing:.04em}
.sh-stats{display:flex;gap:2rem;flex-shrink:0}
.sh-stat-n{
  font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;
  color:var(--sand);letter-spacing:-1.5px;line-height:1;
}
.sh-stat-l{
  font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(245,240,232,.28);margin-top:3px;
}
.sh-back{
  font-family:'Space Mono',monospace;
  background:rgba(245,240,232,.08);border:1px solid rgba(245,240,232,.12);
  padding:8px 16px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(245,240,232,.55);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;
}
.sh-back:hover{background:rgba(245,240,232,.14);color:var(--sand)}

/* ── FILTER BAR ── */
.filterbar{
  display:flex;align-items:center;gap:8px;
  margin-bottom:1rem;padding-bottom:1rem;
  border-bottom:1px solid var(--sand3);flex-wrap:wrap;
}
.result-c{
  font-family:'Space Mono',monospace;font-size:10px;
  color:var(--warm2);margin-left:auto;white-space:nowrap;letter-spacing:.06em;
}
.filter-search{
  display:flex;align-items:center;gap:7px;background:var(--cream);
  border:1px solid var(--sand3);padding:8px 12px;
  font-size:12px;color:var(--ink2);transition:border-color .2s;flex:1;max-width:220px;
}
.filter-search:focus-within{border-color:var(--ink)}
.filter-search input{
  background:none;border:none;outline:none;
  font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--ink);flex:1;width:100%;
}
.filter-search input::placeholder{color:var(--warm)}

/* DROPDOWN */
.dd-wrap{position:relative}
.dd-trigger{
  display:flex;align-items:center;gap:6px;background:var(--cream);
  border:1px solid var(--sand3);padding:8px 12px;
  font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink2);cursor:pointer;transition:all .2s;white-space:nowrap;user-select:none;
}
.dd-trigger:hover{border-color:var(--warm2)}
.dd-trigger.open{border-color:var(--ink);background:var(--sand)}
.dd-trigger.has-val{border-color:var(--ink);background:var(--ink);color:var(--sand)}
.dd-trigger.has-val .dd-arrow{color:rgba(245,240,232,.4)}
.dd-arrow{font-size:9px;color:var(--warm2);transition:transform .2s}
.dd-trigger.open .dd-arrow{transform:rotate(180deg)}
.dd-dot{width:5px;height:5px;border-radius:50%;background:var(--rust);flex-shrink:0}
.dd-menu{
  position:absolute;top:calc(100% + 4px);left:0;
  background:var(--cream);border:1px solid var(--sand3);
  min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:150;
  animation:ddIn .15s ease;
}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.dd-menu-hdr{
  padding:8px 12px 6px;font-family:'Space Mono',monospace;
  font-size:8px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--warm2);font-weight:700;border-bottom:1px solid var(--sand3);
}
.dd-opt{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;font-family:'Space Grotesk',sans-serif;font-size:13px;
  color:var(--ink2);cursor:pointer;transition:background .15s;
}
.dd-opt:hover{background:var(--sand)}
.dd-opt.on{background:var(--sand);font-weight:600;color:var(--ink)}
.dd-opt.on::after{content:'✓';font-family:'Space Mono',monospace;font-size:10px;color:var(--sage2)}
.dd-opt-c{font-family:'Space Mono',monospace;font-size:10px;color:var(--warm2)}
.dd-div{height:1px;background:var(--sand3);margin:3px 0}

/* ACTIVE CHIPS */
.active-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.active-chip{
  display:flex;align-items:center;gap:5px;background:var(--ink);
  padding:5px 10px 5px 12px;font-family:'Space Mono',monospace;
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--sand);font-weight:700;
}
.active-chip-x{cursor:pointer;opacity:.5;font-size:14px;line-height:1;transition:opacity .2s}
.active-chip-x:hover{opacity:1}

/* ── TOOLS GRID ── */
.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--sand3)}
.tc{
  background:var(--cream);border-right:1px solid var(--sand3);border-bottom:1px solid var(--sand3);
  padding:1.25rem;cursor:pointer;transition:all .25s;display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}
.tc:nth-child(3n){border-right:none}
.tc:hover{background:var(--sand)}
.tc::after{
  content:'';position:absolute;top:0;left:0;bottom:0;width:2px;
  background:var(--rust);transform:scaleY(0);transform-origin:top;transition:transform .25s;
}
.tc:hover::after{transform:scaleY(1)}
.tc.feat{background:var(--ink);border-color:rgba(245,240,232,.08);grid-column:span 2}
.tc.feat:hover{background:var(--ink2)}
.tc.feat::after{background:var(--rust2)}
.tc.feat .tc-name{color:var(--sand)}
.tc.feat .tc-desc{color:rgba(245,240,232,.5)}
.tc.feat .tc-tag-i{background:rgba(245,240,232,.08);border-color:rgba(245,240,232,.1);color:rgba(245,240,232,.5)}
.tc.feat .tc-foot{border-top-color:rgba(245,240,232,.08)}
.tc.feat .tc-fl{color:rgba(245,240,232,.32)}
.tc.feat .sd{background:rgba(245,240,232,.15)}
.tc.feat .sd.on{background:var(--sand)}
.tc-logo{
  width:36px;height:36px;font-size:14px;font-weight:800;color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:.85rem;
}
.tc-top{display:flex;align-items:flex-start;gap:6px;margin-bottom:.4rem}
.tc-name{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.3px;flex:1;line-height:1.2}
.tc-desc{font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--ink3);line-height:1.65;margin-bottom:.85rem;flex:1;opacity:.8}
.tc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:.85rem}
.tc-tag-i{border:1px solid var(--sand3);padding:2px 8px;font-family:'Space Mono',monospace;font-size:9px;color:var(--warm2);letter-spacing:.04em}
.tc-foot{display:flex;align-items:center;justify-content:space-between;padding-top:.75rem;border-top:1px solid var(--sand3);margin-top:auto}
.tc-fl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--warm2)}
.sd{width:6px;height:6px;background:var(--sand3);flex-shrink:0}
.sd.on{background:var(--ink)}
.empty-state{
  grid-column:span 3;text-align:center;padding:4rem 1rem;
  font-family:'Space Mono',monospace;font-size:11px;color:var(--warm2);letter-spacing:.08em;
}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .tools-grid{grid-template-columns:1fr 1fr}
  .tc.feat{grid-column:span 2}
  .sector-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){
  .shell{grid-template-columns:1fr}
  .sb{display:none}
  .nav-links{display:none}
  .sector-grid{grid-template-columns:1fr 1fr}
  .sh-stats{display:none}
}
@media(max-width:480px){
  .sector-grid{grid-template-columns:1fr}
  .tools-grid{grid-template-columns:1fr}
  .tc.feat{grid-column:span 1}
}
</style>
</head>

let view='picker';
let activeSector=null;
let filters={pricing:'all',skill:'all',type:'all',usecase:'all',search:''};
let openDD=null;

function closeAllDD(){
  document.querySelectorAll('.dd-menu').forEach(m=>m.remove());
  document.querySelectorAll('.dd-trigger').forEach(t=>t.classList.remove('open'));
  openDD=null;
}

function toggleDD(id){
  if(openDD===id){closeAllDD();return;}
  closeAllDD();openDD=id;
  const trigger=document.getElementById('dd-'+id);
  trigger.classList.add('open');
  const tools=TOOLS[activeSector]||[];
  let html='';
  if(id==='pricing'){
    html=`<div class="dd-menu-hdr">Pricing</div>
    ${[['all','All pricing'],['Free tier','Free tier only'],['Paid','Paid only']].map(([v,l])=>
      `<div class="dd-opt ${filters.pricing===v?'on':''}" onclick="setF('pricing','${v}')">${l}</div>`
    ).join('')}`;
  }
  if(id==='skill'){
    html=`<div class="dd-menu-hdr">Skill level</div>
    ${[['all','All levels'],['1','Beginner'],['2','Intermediate'],['3','Advanced']].map(([v,l])=>
      `<div class="dd-opt ${filters.skill===v?'on':''}" onclick="setF('skill','${v}')">${l}</div>`
    ).join('')}`;
  }
  if(id==='type'){
    const nC=tools.filter(t=>t.isNew).length;
    const hC=tools.filter(t=>t.hot).length;
    html=`<div class="dd-menu-hdr">Show</div>
    <div class="dd-opt ${filters.type==='all'?'on':''}" onclick="setF('type','all')">All tools</div>
    <div class="dd-div"></div>
    <div class="dd-opt ${filters.type==='new'?'on':''}" onclick="setF('type','new')">New this week <span class="dd-opt-c">${nC}</span></div>
    <div class="dd-opt ${filters.type==='hot'?'on':''}" onclick="setF('type','hot')">Trending <span class="dd-opt-c">${hC}</span></div>`;
  }
  if(id==='usecase'){
    const allTags=[...new Set(tools.flatMap(t=>t.tags))];
    html=`<div class="dd-menu-hdr">Use case</div>
    <div class="dd-opt ${filters.usecase==='all'?'on':''}" onclick="setF('usecase','all')">All use cases</div>
    <div class="dd-div"></div>
    ${allTags.map(tag=>{
      const c=tools.filter(t=>t.tags.includes(tag)).length;
      return `<div class="dd-opt ${filters.usecase===tag?'on':''}" onclick="setF('usecase','${tag}')">${tag} <span class="dd-opt-c">${c}</span></div>`;
    }).join('')}`;
  }
  const menu=document.createElement('div');
  menu.className='dd-menu';menu.innerHTML=html;
  trigger.parentNode.appendChild(menu);
  setTimeout(()=>{
    document.addEventListener('click',function h(e){
      if(!trigger.contains(e.target)&&!menu.contains(e.target)){closeAllDD();document.removeEventListener('click',h);}
    });
  },0);
}

function setF(key,val){filters[key]=val;closeAllDD();renderTools();}

function getLabel(key){
  const map={
    pricing:{all:'Pricing','Free tier':'Free tier',Paid:'Paid only'},
    skill:{all:'Skill level','1':'Beginner','2':'Intermediate','3':'Advanced'},
    type:{all:'Show',new:'New this week',hot:'Trending'},
    usecase:{all:'Use case'},
  };
  return(map[key]&&map[key][filters[key]])||filters[key];
}
function hasVal(key){return filters[key]&&filters[key]!=='all';}
function removeFilter(key){filters[key]='all';renderTools();}

function renderSidebar(){
  const sb=document.getElementById('sidebar');
  if(view==='picker'){
    sb.innerHTML=`
      <div class="sb-logo">laize.ai</div>
      <a class="snav" href="index.html"><div class="snavdot"></div>Explore</a>
      <a class="snav on" href="sectors.html"><div class="snavdot"></div>Sectors</a>
      <a class="snav" href="whats-new.html"><div class="snavdot"></div>What's new</a>
      <a class="snav" href="compare.html"><div class="snavdot"></div>Compare</a>
      <a class="snav" href="learn.html"><div class="snavdot"></div>Learn</a>
      <div class="sb-foot"><div class="suser"><div class="sav">AM</div><div><div class="sun">Alex M.</div><div class="sur">Marketer</div></div></div></div>`;
  } else {
    const s=SECTORS.find(s=>s.id===activeSector);
    sb.innerHTML=`
      <div class="sb-logo">laize.ai</div>
      <button class="sb-back" onclick="goBack()">← All sectors</button>
      <div class="sb-sector-title">${s.name}</div>
      <div class="sb-divider"></div>
      <a class="snav" href="index.html"><div class="snavdot"></div>Explore</a>
      <a class="snav on" href="sectors.html"><div class="snavdot"></div>Sectors</a>
      <a class="snav" href="whats-new.html"><div class="snavdot"></div>What's new</a>
      <a class="snav" href="compare.html"><div class="snavdot"></div>Compare</a>
      <a class="snav" href="learn.html"><div class="snavdot"></div>Learn</a>
      <div class="sb-foot"><div class="suser"><div class="sav">AM</div><div><div class="sun">Alex M.</div><div class="sur">Marketer</div></div></div></div>`;
  }
}

function renderPicker(){
  document.getElementById('main').innerHTML=`
    <div class="picker-header">
      <div class="picker-eyebrow">Explore by industry</div>
      <h1 class="picker-h1">Which sector are you<br><em>working in?</em></h1>
      <p class="picker-sub">Choose a sector to explore AI tools curated for your industry.</p>
      <div class="picker-search">
        <span class="picker-search-icon">⌕</span>
        <input type="text" placeholder="Search sectors..." oninput="filterSectors(this.value)"/>
      </div>
    </div>
    <div class="sector-grid" id="sector-grid">
      ${SECTORS.map((s,i)=>`
        <div class="sector-card" onclick="openSector('${s.id}')">
          <div class="sc-num">${String(i+1).padStart(2,'0')}</div>
          <div class="sc-name">${s.name}</div>
          <div class="sc-sub">${s.sub}</div>
          <div class="sc-count">${s.count} tools</div>
        </div>`).join('')}
    </div>`;
}

function filterSectors(q){
  document.querySelectorAll('.sector-card').forEach((c,i)=>{
    c.style.display=SECTORS[i].name.toLowerCase().includes(q.toLowerCase())?'':'none';
  });
}

function openSector(id){
  activeSector=id;view='tools';
  filters={pricing:'all',skill:'all',type:'all',usecase:'all',search:''};
  renderSidebar();renderTools();
  window.scrollTo({top:0,behavior:'smooth'});
}

function goBack(){
  view='picker';activeSector=null;
  filters={pricing:'all',skill:'all',type:'all',usecase:'all',search:''};
  renderSidebar();renderPicker();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderTools(){
  const s=SECTORS.find(s=>s.id===activeSector);
  let tools=[...(TOOLS[activeSector]||[])];
  const total=tools.length;
  if(filters.pricing!=='all') tools=tools.filter(t=>t.pricing===filters.pricing);
  if(filters.skill==='1') tools=tools.filter(t=>t.skill===1);
  if(filters.skill==='2') tools=tools.filter(t=>t.skill===2);
  if(filters.skill==='3') tools=tools.filter(t=>t.skill===3);
  if(filters.type==='new') tools=tools.filter(t=>t.isNew);
  if(filters.type==='hot') tools=tools.filter(t=>t.hot);
  if(filters.usecase&&filters.usecase!=='all') tools=tools.filter(t=>t.tags.includes(filters.usecase));
  if(filters.search){const q=filters.search.toLowerCase();tools=tools.filter(t=>t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q));}

  const freeC=(TOOLS[activeSector]||[]).filter(t=>t.pricing==='Free tier').length;
  const newC=(TOOLS[activeSector]||[]).filter(t=>t.isNew).length;

  const chips=['pricing','skill','type','usecase'].filter(k=>hasVal(k)).map(k=>
    `<div class="active-chip">${getLabel(k)}<span class="active-chip-x" onclick="removeFilter('${k}')">×</span></div>`
  ).join('');

  document.getElementById('main').innerHTML=`
    <div class="sector-header" data-sector="${s.name.toUpperCase()}">
      <div class="sh-left">
        <div class="sh-eyebrow">Sector — ${String(SECTORS.findIndex(x=>x.id===activeSector)+1).padStart(2,'0')} / ${String(SECTORS.length).padStart(2,'0')}</div>
        <div class="sh-title">${s.name} AI</div>
        <div class="sh-sub">${s.sub}</div>
      </div>
      <div class="sh-stats">
        <div><div class="sh-stat-n">${s.count}</div><div class="sh-stat-l">Total tools</div></div>
        <div><div class="sh-stat-n">${freeC}</div><div class="sh-stat-l">Free tier</div></div>
        <div><div class="sh-stat-n">${newC}</div><div class="sh-stat-l">New</div></div>
      </div>
      <button class="sh-back" onclick="goBack()">← All sectors</button>
    </div>

    <div class="filterbar">
      <div class="filter-search">
        <span style="color:var(--warm);font-size:14px;flex-shrink:0">⌕</span>
        <input type="text" placeholder="Search tools…" value="${filters.search||''}" oninput="filters.search=this.value;renderTools()"/>
      </div>
      <div class="dd-wrap">
        <div class="dd-trigger ${hasVal('pricing')?'has-val':''}" id="dd-pricing" onclick="toggleDD('pricing')">
          ${hasVal('pricing')?'<div class="dd-dot"></div>':''}${getLabel('pricing')}<span class="dd-arrow">▾</span>
        </div>
      </div>
      <div class="dd-wrap">
        <div class="dd-trigger ${hasVal('skill')?'has-val':''}" id="dd-skill" onclick="toggleDD('skill')">
          ${hasVal('skill')?'<div class="dd-dot"></div>':''}${getLabel('skill')}<span class="dd-arrow">▾</span>
        </div>
      </div>
      <div class="dd-wrap">
        <div class="dd-trigger ${hasVal('type')?'has-val':''}" id="dd-type" onclick="toggleDD('type')">
          ${hasVal('type')?'<div class="dd-dot"></div>':''}${getLabel('type')}<span class="dd-arrow">▾</span>
        </div>
      </div>
      <div class="dd-wrap">
        <div class="dd-trigger ${hasVal('usecase')?'has-val':''}" id="dd-usecase" onclick="toggleDD('usecase')">
          ${hasVal('usecase')?'<div class="dd-dot"></div>':''}${getLabel('usecase')}<span class="dd-arrow">▾</span>
        </div>
      </div>
      <span class="result-c">${tools.length} / ${total}</span>
    </div>

    ${chips?`<div class="active-chips">${chips}</div>`:''}

    <div class="tools-grid">
      ${tools.length===0
        ?'<div class="empty-state">No tools match these filters — try adjusting your selection.</div>'
        :tools.map(t=>`
          <div class="tc ${t.feat?'feat':''}">
            <div class="tc-logo" style="background:${t.bg}">${t.logo}</div>
            <div class="tc-top">
              <div class="tc-name">${t.name}</div>
              ${t.isNew?'<span class="bdg bdg-new">New</span>':''}
              ${t.hot&&!t.isNew?'<span class="bdg bdg-hot">Hot</span>':''}
            </div>
            <div class="tc-desc">${t.desc}</div>
            <div class="tc-tags">${t.tags.map(tag=>`<span class="tc-tag-i">${tag}</span>`).join('')}</div>
            <div class="tc-foot">
              <span class="tc-fl">${t.pricing}</span>
              <div style="display:flex;gap:3px">
                <div class="sd ${t.skill>=1?'on':''}"></div>
                <div class="sd ${t.skill>=2?'on':''}"></div>
                <div class="sd ${t.skill>=3?'on':''}"></div>
              </div>
            </div>
          </div>`).join('')
      }
    </div>`;
}

renderSidebar();
renderPicker();
</script>
